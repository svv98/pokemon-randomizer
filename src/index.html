<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Randomizer</title>
    <link href="./styles.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1 class="mainTitle"><span>Pokémon </span> RANDOMIZER</h1>
    </header>
    <main>
        <section id="Randomizer">
            <section id="typeSelector">
                <div class="typeSelect types">
                    <button class="selectedTypes">placeholder:)</button>
                    <button class="selectedTypes">placeholder:)</button>
                </div>
                <div class="typeSelect">
                    <button class="selectTypeButton">Select Type</button>
                </div>
            </section>
            <section id="randomizerButton">
                <button>
                    <img src="./media/pokeball.png">
                </button>
            </section>
            <section id="displayPokemon">
                <div class="pokemonImage">
                    <img src="./media/smoliv.png">
                </div>
                <div class="pokemonName">Smoliv</div>
            </section>
        </section>
        
        <section id="table">
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Base</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Head</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Ears</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Nose</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Eyes</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Arms</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Hands</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Legs</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Feet</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Tail</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Extras</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
            <div>
                <div class="pokemonPartDiv">
                    <p class="pokemonPart">Colors</p>
                </div>
                <div class="displayPokemonTable">
                    <div class="pokemonImageTable">
                        <img src="./media/smoliv.png">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <dialog id="selectTypeModal" class="type modal">
        <form id="selectTypeForm">
            <fieldset>
                <legend>Select Type (s)</legend>
                <div class="allButtons">
                    <button class="select All">Select All</button>
                    <button type="reset">Deselect All</button>
                </div>
                <div class="typeCheckboxes">
                    <label class="checkboxButton">
                        <input type="checkbox" name="normal" value="normal">
                        <span class="typeButton">
                            <img src="./media/types/normal.webp">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="grass" value="grass">
                        <span class="typeButton">
                            <img src="./media/types/grass.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="fire" value="fire">
                        <span class="typeButton">
                            <img src="./media/types/fire.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="water" value="water">
                        <span class="typeButton">
                            <img src="./media/types/water.webp">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="electric" value="electric">
                        <span class="typeButton">
                            <img src="./media/types/electric.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="bug" value="bug">
                        <span class="typeButton">
                            <img src="./media/types/bug.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="flying" value="flying">
                        <span class="typeButton">
                            <img src="./media/types/flying.webp">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="rock" value="rock">
                        <span class="typeButton">
                            <img src="./media/types/rock.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="poison" value="poison">
                        <span class="typeButton">
                            <img src="./media/types/poison.webp">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="ground" value="ground">
                        <span class="typeButton">
                            <img src="./media/types/ground.webp">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="ice" value="ice">
                        <span class="typeButton">
                            <img src="./media/types/ice.webp">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="fighting" value="fighting">
                        <span class="typeButton">
                            <img src="./media/types/fighting.webp">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="psychic" value="psychic">
                        <span class="typeButton">
                            <img src="./media/types/psychic.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="ghost" value="ghost">
                        <span class="typeButton">
                            <img src="./media/types/ghost.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="dragon" value="dragon">
                        <span class="typeButton">
                            <img src="./media/types/dragon.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="dark" value="dark">
                        <span class="typeButton">
                            <img src="./media/types/dark.png">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="steel" value="steel">
                        <span class="typeButton">
                            <img src="./media/types/steel.webp">
                        </span>
                    </label>
                    <label class="checkboxButton">
                        <input type="checkbox" name="fairy" value="fairy">
                        <span class="typeButton">
                            <img src="./media/types/fairy.webp">
                        </span>
                    </label>
                </div>
                <div class="modalButtons">
                    <button>Cancel</button>
                    <button type="submit">Done</button>
                </div>                    
            </fieldset>
        </form>
    </dialog>
    <script src="index.js"></script>
</body>
</html>
